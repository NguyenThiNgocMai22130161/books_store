<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Tiệm Sách'"></title>
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Tùy chỉnh thêm để phù hợp với Form */
        .form-card {
            background: var(--card-bg, #FFFFFF);
            border: 1px solid #EEEEEE;
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #757575;
        }
        .form-control {
            width: 100%;
            background: #F9F9F9;
            border: 1px solid #EEEEEE;
            color: #000000;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color, #EE4D2D);
        }
        .image-preview-wrapper {
            margin-top: 1rem;
            padding: 1rem;
            background: #F9F9F9;
            border-radius: 8px;
            text-align: center;
        }
        .image-preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 4px;
            border: 1px solid #EEEEEE;
        }
        .invalid-feedback {
            color: #E74C3C;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 0;">
            <a href="/" class="navbar-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                Tiệm Sách
            </a>
            <div class="navbar-nav">
                <a href="/books">Sách</a>
                <a href="/login" class="text-muted">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div class="page-header" style="margin-top: 2rem; border: none;">
            <h1 th:text="${pageTitle}">Thêm/Sửa Sách</h1>
            <p class="text-muted">Cập nhật thông tin chi tiết cho kho sách của bạn</p>
        </div>

        <div class="form-card fade-in">
            <form method="post" th:action="@{/books/save}" th:object="${book}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="title">Tên Sách</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Ví dụ: Đắc Nhân Tâm" required>
                        <div th:if="${#fields.hasErrors('title')}" class="invalid-feedback" th:errors="*{title}"></div>
                    </div>

                    <div class="form-group">
                        <label for="author">Tác Giả</label>
                        <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="Tên tác giả" required>
                    </div>

                    <!-- Tìm phần select category và thay thế như sau: -->
<div class="form-group">
    <label for="category">Thể Loại</label>
    <select id="category" th:field="*{category}" class="form-control" required>
        <option value="">-- Chọn thể loại --</option>
        <!-- Hiển thị danh sách thể loại từ database -->
        <option th:each="cat : ${categories}" 
                th:value="${cat}" 
                th:text="${cat}"
                th:selected="${cat == book.category}">
        </option>
    </select>
    <div th:if="${#fields.hasErrors('category')}" class="invalid-feedback" th:errors="*{category}"></div>
</div>

                    <div class="form-group">
                        <label for="price">Giá (VNĐ)</label>
                        <input type="number" id="price" th:field="*{price}" class="form-control" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Số Lượng Kho</label>
                        <input type="number" id="quantity" th:field="*{quantity}" class="form-control" placeholder="0">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label for="description">Mô Tả Nội Dung</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="Viết tóm tắt về cuốn sách..."></textarea>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label for="imageUrl">Link Ảnh (URL)</label>
                    <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/image.jpg" oninput="updatePreview(this.value)">
                    
                    <div id="previewContainer" class="image-preview-wrapper" th:style="*{imageUrl != null} ? 'display:block' : 'display:none'">
                        <p style="margin-bottom: 0.5rem; font-size: 0.8rem; color: #666;">Xem trước hình ảnh:</p>
                        <img id="imgPreview" th:src="*{imageUrl}" alt="Preview" class="image-preview">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #EEEEEE;">
                    <button type="submit" class="btn btn-primary" style="display: flex; align-items: center; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Lưu thông tin
                    </button>
                    <a href="/books" class="btn btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid #EEEEEE; color: #000000;">
                        Hủy bỏ
                    </a>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer" style="margin-top: 4rem;">
        <div class="container">
            <div class="d-flex justify-center gap-3 mb-4">
                <a href="/books">Sách</a>
                <a href="/cart">Giỏ hàng</a>
                <a href="/orders">Lịch sử mua hàng</a>
                <a href="/user/profile">Tài khoản</a>
            </div>
            <p>© 2026 Tiệm Sách Management System</p>
        </div>
    </footer>

    <script>
        function updatePreview(url) {
            const container = document.getElementById('previewContainer');
            const img = document.getElementById('imgPreview');
            if(url) {
                img.src = url;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }
    </script>
</body>
</html>
