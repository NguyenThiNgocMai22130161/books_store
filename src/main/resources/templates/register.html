<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Tiệm Sách</title>
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F5F5F5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid #EEEEEE;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #000000;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #757575;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-control {
            background: #F9F9F9;
            border: 1px solid #EEEEEE;
            color: #000000;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #EE4D2D;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(238, 77, 45, 0.1);
            outline: none;
        }
        .btn-register {
            background: #EE4D2D;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }
        .btn-register:hover {
            background: #DC411D;
            transform: translateY(-2px);
        }
        .oauth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #999999;
        }
        .oauth-divider::before, .oauth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #EEEEEE;
        }
        .oauth-divider span {
            padding: 0 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: transparent;
            border: 1px solid #EEEEEE;
            color: #000000;
            padding: 0.75rem;
            border-radius: 10px;
            width: 100%;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .btn-google:hover {
            background: #F9F9F9;
            border-color: #999999;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #757575;
        }
        .auth-footer a {
            color: #EE4D2D;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: center; padding: 1rem;">
            <a href="/" class="navbar-brand" style="margin: 0; font-size: 1.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Tiệm Sách
            </a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2>Tạo tài khoản</h2>
                <p style="color: #757575; font-size: 0.9rem;">Khám phá kho sách khổng lồ ngay hôm nay</p>
            </div>

            <div th:if="${usernameError}" class="alert alert-danger" style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem;" th:text="${usernameError}"></div>
            <div th:if="${emailError}" class="alert alert-danger" style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem;" th:text="${emailError}"></div>

            <form method="post" th:action="@{/register}" th:object="${user}">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" th:value="*{username}" class="form-control" placeholder="Ví dụ: nva_2026" required>
                </div>

                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" th:value="*{email}" class="form-control" placeholder="name@company.com" required>
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" name="fullName" th:value="*{fullName}" class="form-control" placeholder="Nhập tên đầy đủ của bạn">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn-register">Đăng ký ngay</button>
            </form>

            <div class="oauth-divider">
                <span>Hoặc đăng ký bằng</span>
            </div>

            <a href="/oauth2/authorization/google" class="btn-google">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Tiếp tục với Google
            </a>

            <div class="auth-footer">
                Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Tiệm Sách Authorization System. Bảo mật bởi Spring Security.</p>
        </div>
    </footer>
</body>
</html>
