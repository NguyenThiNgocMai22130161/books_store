<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Tiệm Sách</title>
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .profile-card {
            max-width: 700px;
            margin: 3rem auto;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #EEEEEE;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .profile-banner {
            height: 120px;
            background: linear-gradient(135deg, #EE4D2D 0%, #DC411D 100%);
            position: relative;
        }
        .avatar-wrapper {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: #F9F9F9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #FFFFFF;
        }
        .profile-content {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }
        .profile-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 2.5rem;
            text-align: left;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #F9F9F9;
            border-radius: 12px;
            border: 1px solid #EEEEEE;
        }
        .info-label {
            color: #757575;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .info-value {
            color: #000000;
            font-weight: 600;
        }
        .role-badge {
            background: rgba(238, 77, 45, 0.1);
            color: #EE4D2D;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }
        .status-active { background: rgba(39, 174, 96, 0.1); color: #27AE60; }
        .status-inactive { background: rgba(231, 76, 60, 0.1); color: #E74C3C; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 0;">
            <a href="/" class="navbar-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Tiệm Sách
            </a>
            <div class="navbar-nav">
                <a href="/books">Sách</a>
                <a href="#" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();" class="text-muted">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" x2="9" y1="12" y2="12"/>
                    </svg>
                    Đăng xuất
                </a>
            </div>
        </div>
    </nav>

    <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>
    
    <div class="container">
        <div class="profile-card fade-in">
            <div class="profile-banner">
                <div class="avatar-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#EE4D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>

            <div class="profile-content">
                <h2 th:text="${user.fullName}" style="color: #000000; margin-bottom: 0.5rem;">Họ Tên Người Dùng</h2>
                <div style="display: flex; justify-content: center;">
                    <span th:class="${user.active} ? 'status-pill status-active' : 'status-pill status-inactive'">
                        <span th:text="${user.active ? '● Đang hoạt động' : '○ Tạm khóa'}"></span>
                    </span>
                </div>

                <div class="profile-info-grid">
                    <div class="info-item">
                        <span class="info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Tên đăng nhập
                        </span>
                        <span class="info-value" th:text="${user.username}">username</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            Email liên hệ
                        </span>
                        <span class="info-value" th:text="${user.email}">email@example.com</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            Phân quyền hệ thống
                        </span>
                        <div style="display: flex; gap: 0.5rem;">
                            <span th:each="role : ${user.roles}" class="role-badge" th:text="${role.name()}">ROLE</span>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
                    <a href="/books" class="btn btn-secondary" style="background: transparent; border: 1px solid #EEEEEE; color: #000000;">
                        Quay lại cửa hàng
                    </a>
                    <button class="btn btn-primary" onclick="window.print()" style="display: flex; align-items: center; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        Xuất thông tin
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="d-flex justify-center gap-3 mb-4">
                <a href="/books">Sách</a>
                <a href="/cart">Giỏ hàng</a>
                <a href="/orders">Lịch sử mua hàng</a>
                <a href="/user/profile">Tài khoản</a>
            </div>
            <p>© 2026 Tiệm Sách Management. Thông tin tài khoản được mã hóa bảo mật.</p>
        </div>
    </footer>
</body>
</html>
